<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบฝึกข้อสอบเลื่อนฐานะ ส.อ. เป็น จ.ส.อ.</title>
<style>
  :root{
    --primary:#1e3a5f;
    --primary-dark:#10233b;
    --primary-soft:#e7edf5;
    --gold:#c9a24b;
    --gold-dark:#a5822f;
    --bg:#f4f6f9;
    --card:#ffffff;
    --text:#1b2530;
    --muted:#5b6b7c;
    --danger:#b3261e;
    --danger-soft:#fdecea;
    --success:#1e7a3d;
    --success-soft:#e7f6ec;
    --radius:14px;
    --shadow:0 2px 10px rgba(16,35,59,.08);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Sarabun','Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);}
  #app{min-height:100vh;display:flex;flex-direction:column;}
  .topbar{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow);}
  .topbar .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.1rem;}
  .topbar .brand .badge{width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;font-weight:800;}
  .topbar button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:.85rem;}
  .topbar button:hover{background:rgba(255,255,255,.12);}
  main{flex:1;display:flex;justify-content:center;padding:24px 16px 60px;}
  .wrap{width:100%;max-width:640px;}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px;margin-bottom:18px;}
  h1{font-size:1.4rem;margin:0 0 6px;color:var(--primary-dark);}
  h2{font-size:1.1rem;margin:0 0 14px;color:var(--primary-dark);}
  p.sub{color:var(--muted);margin:0 0 20px;font-size:.92rem;}
  label{display:block;font-size:.85rem;color:var(--muted);margin:14px 0 6px;}
  input[type=text],input[type=password],input[type=number],select{
    width:100%;padding:11px 13px;border:1px solid #cfd8e3;border-radius:10px;font-size:1rem;background:#fff;color:var(--text);
  }
  input:focus,select:focus{outline:2px solid var(--gold);border-color:var(--gold);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:10px;padding:12px 20px;font-size:.98rem;font-weight:600;cursor:pointer;width:100%;margin-top:16px;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-gold{background:var(--gold);color:var(--primary-dark);}
  .btn-gold:hover{background:var(--gold-dark);color:#fff;}
  .btn-outline{background:#fff;color:var(--primary);border:1.5px solid var(--primary);}
  .btn-outline:hover{background:var(--primary-soft);}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-sm{width:auto;padding:7px 14px;font-size:.82rem;margin-top:0;}
  .row{display:flex;gap:10px;}
  .row>*{flex:1;}
  .link-btn{background:none;border:none;color:var(--primary);text-decoration:underline;cursor:pointer;font-size:.9rem;padding:0;}
  .msg{padding:12px 14px;border-radius:10px;font-size:.88rem;margin-bottom:14px;}
  .msg-error{background:var(--danger-soft);color:var(--danger);}
  .msg-success{background:var(--success-soft);color:var(--success);}
  .msg-info{background:var(--primary-soft);color:var(--primary-dark);}
  .version-status{text-align:center;font-size:.78rem;color:var(--muted);margin-top:10px;}
  .version-status.ok{color:var(--success);}
  .version-status.bad{color:var(--danger);}
  .menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .menu-item{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 16px;text-align:center;cursor:pointer;border:2px solid transparent;transition:.15s;}
  .menu-item:hover{border-color:var(--gold);}
  .menu-item .icon{font-size:1.8rem;margin-bottom:8px;}
  .menu-item .label{font-weight:700;color:var(--primary-dark);font-size:.95rem;}
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;}
  .stat-box{background:var(--primary-soft);border-radius:10px;padding:14px 8px;text-align:center;}
  .stat-box .num{font-size:1.3rem;font-weight:800;color:var(--primary-dark);}
  .stat-box .lbl{font-size:.72rem;color:var(--muted);}
  table{width:100%;border-collapse:collapse;font-size:.85rem;}
  th,td{padding:8px 6px;text-align:left;border-bottom:1px solid #e6eaf0;}
  th{color:var(--muted);font-weight:600;}
  .progress-bar{height:8px;background:#e6eaf0;border-radius:6px;overflow:hidden;margin-bottom:18px;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--primary));}
  .q-text{font-size:1.05rem;font-weight:600;margin-bottom:18px;line-height:1.5;}
  .opt{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:1.5px solid #dde3ea;border-radius:10px;margin-bottom:10px;cursor:pointer;}
  .opt:hover{border-color:var(--gold);}
  .opt.selected{border-color:var(--primary);background:var(--primary-soft);}
  .opt.correct{border-color:var(--success);background:var(--success-soft);}
  .opt.wrong{border-color:var(--danger);background:var(--danger-soft);}
  .opt .letter{font-weight:800;color:var(--primary);min-width:20px;}
  .quiz-nav{display:flex;justify-content:space-between;gap:10px;margin-top:6px;}
  .timer{font-weight:700;color:var(--gold-dark);}
  .badge-pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:700;}
  .pill-pending{background:#fff4e0;color:#9a6b00;}
  .pill-active{background:var(--success-soft);color:var(--success);}
  .pill-suspended{background:var(--danger-soft);color:var(--danger);}
  .admin-tabs{display:flex;gap:8px;margin-bottom:16px;}
  .admin-tabs button{flex:1;}
  .tiny{font-size:.75rem;color:var(--muted);}
  .footer-note{text-align:center;color:var(--muted);font-size:.78rem;padding:16px;}
</style>
</head>

function fmtDate(v){
  try{
    var d = new Date(v);
    if (isNaN(d.getTime())) return String(v);
    return d.toLocaleString('th-TH', {dateStyle:'short', timeStyle:'short'});
  }catch(e){ return String(v); }
}
function shuffle(arr){
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
function subjectTitle(code){
  for (var i=0;i<SUBJECTS.length;i++){ if (SUBJECTS[i].subject === code) return SUBJECTS[i].subjectTitle; }
  return code;
}

function loadSession(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) session = JSON.parse(raw);
  }catch(e){ session = null; }
}
function saveSession(s){
  session = s;
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }catch(e){}
}
function clearSession(){
  session = null;
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
}

function debugSuffix(resp){
  // แสดง error code ดิบต่อท้ายข้อความ เผื่อเจอ error ที่ยังไม่ได้ map เป็นภาษาไทยไว้ จะได้ debug ง่ายขึ้น
  if (!resp) return '';
  var parts = [];
  if (resp.error) parts.push(resp.error);
  if (resp.message) parts.push(resp.message);
  return parts.length ? ' [' + parts.join(': ') + ']' : '';
}

function apiCall(action, payload){
  // เรียกผ่าน Netlify Function /api (same-origin) — ดู CONFIG ด้านบนว่าทำไม
  var body = Object.assign({action: action}, payload || {});
  var url = API_PROXY_PATH + '?action=' + encodeURIComponent(action) + '&payload=' + encodeURIComponent(JSON.stringify(body));
  return fetch(url, { method: 'GET' })
    .then(function(res){ return res.json(); })
    .catch(function(err){ return {ok:false, error:'network_error', message:String(err)}; });
}

// เรียกก่อนทุก action ที่ต้องใช้ session — ถ้า session_invalid ให้เตะกลับหน้า login ทันที
function handleSessionInvalidIfNeeded(resp){
  if (resp && resp.ok === false && resp.error === 'session_invalid'){
    clearSession();
    renderLogin({kicked:true});
    return true; // ผู้เรียกต้อง return ทันทีเมื่อค่านี้เป็น true ห้ามทำงานต่อ (กัน double-render)
  }
  return false;
}

/* ================= VERSION CHECK ================= */
function checkVersionBadge(targetEl){
  apiCall('ping', {}).then(function(resp){
    if (!targetEl.isConnected) return;
    if (resp && resp.ok && resp.serverVersion === EXPECTED_SERVER_VERSION){
      targetEl.textContent = '✅ เซิร์ฟเวอร์เป็นโค้ดล่าสุด';
      targetEl.className = 'version-status ok';
    } else if (resp && resp.ok){
      targetEl.textContent = '⚠️ พบเวอร์ชันเซิร์ฟเวอร์ไม่ตรงกับที่ไคลเอนต์คาดไว้ (server: ' + resp.serverVersion + ')';
      targetEl.className = 'version-status bad';
    } else {
      targetEl.textContent = '❌ เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ในขณะนี้';
      targetEl.className = 'version-status bad';
    }
  });
}

    // สุ่มแบบกระจายตามสัดส่วนของแต่ละวิชาคร่าวๆ โดยสับทั้งหมดแล้วตัดตามจำนวนข้อที่กำหนด

      questions: picked,
      mode: 'mock',
      subject: 'mixed',
      subjectLabel: 'จำลองการสอบ (คละทุกวิชา · ' + picked.length + ' ข้อ)',
      timeLimit: seconds,
      onFinish: renderHome

/* ================= QUIZ ENGINE ================= */
function startQuiz(cfg){
  currentQuiz = {
    questions: cfg.questions,
    answers: {}, // id -> selected letter
    checked: {}, // id -> {correct, correctAnswer} — เฉลยที่เปิดดูแล้ว (โหมดฝึกทำเท่านั้น)
    index: 0,
    mode: cfg.mode,
    subject: cfg.subject,
    subjectLabel: cfg.subjectLabel,
    timeLimit: cfg.timeLimit,
    startedAt: Date.now(),
    onFinish: cfg.onFinish,
    timerId: null,
  };
  renderQuizQuestion();
}

function renderQuizQuestion(){
  var quiz = currentQuiz;
  if (!quiz) return;
  var q = quiz.questions[quiz.index];

  app.innerHTML = '';
  var topbarHtml = '<div class="topbar"><div class="brand"><span class="badge">จสอ</span> ' + quiz.subjectLabel + '</div>';
  if (quiz.timeLimit){
    topbarHtml += '<div class="timer" id="timerDisplay">--:--</div>';
  }
  topbarHtml += '</div>';
  app.appendChild(el(topbarHtml));

  var main = el('<main><div class="wrap"></div></main>');
  var wrap = main.querySelector('.wrap');

  var pct = Math.round((quiz.index / quiz.questions.length) * 100);
  wrap.appendChild(el('<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>'));

  var card = el('<div class="card"></div>');
  card.appendChild(el('<div class="tiny">ข้อ ' + (quiz.index + 1) + ' / ' + quiz.questions.length + (q.subjectTitle ? ' · ' + q.subjectTitle : '') + '</div>'));
  card.appendChild(el('<div class="q-text">' + escapeHtml(q.q) + '</div>'));

  var isPractice = quiz.mode === 'practice';
  var checkedInfo = quiz.checked[q.id]; // {correct, correctAnswer} ถ้าเปิดเฉลยข้อนี้แล้ว (โหมดฝึกทำเท่านั้น)

  var optsWrap = el('<div></div>');
  ['A','B','C','D'].forEach(function(letter){
    if (!q.options[letter]) return;
    var opt = el('<div class="opt" data-letter="' + letter + '"><span class="letter">' + letter + '.</span><span>' + escapeHtml(q.options[letter]) + '</span></div>');
    if (quiz.answers[q.id] === letter) opt.classList.add('selected');
    if (checkedInfo){
      if (letter === checkedInfo.correctAnswer) opt.classList.add('correct');
      else if (letter === quiz.answers[q.id]) opt.classList.add('wrong');
    }
    opt.addEventListener('click', function(){
      quiz.answers[q.id] = letter;
      optsWrap.querySelectorAll('.opt').forEach(function(o){ o.classList.remove('selected','correct','wrong'); });
      opt.classList.add('selected');
      if (isPractice) checkAnswerInline(q, letter, optsWrap, feedbackHolder);
    });
    optsWrap.appendChild(opt);
  });
  card.appendChild(optsWrap);

  var feedbackHolder = el('<div></div>');
  if (isPractice && checkedInfo){
    renderAnswerFeedback(feedbackHolder, checkedInfo);
  }
  card.appendChild(feedbackHolder);

  var nav = el('<div class="quiz-nav"></div>');
  var prevBtn = el('<button class="btn btn-outline btn-sm" style="flex:1;">← ก่อนหน้า</button>');
  prevBtn.disabled = quiz.index === 0;
  prevBtn.addEventListener('click', function(){ quiz.index--; renderQuizQuestion(); });
  nav.appendChild(prevBtn);

  if (quiz.index < quiz.questions.length - 1){
    var nextBtn = el('<button class="btn btn-primary btn-sm" style="flex:1;">ถัดไป →</button>');
    nextBtn.addEventListener('click', function(){ quiz.index++; renderQuizQuestion(); });
    nav.appendChild(nextBtn);
  } else {
    var submitBtn = el('<button class="btn btn-gold btn-sm" style="flex:1;">ส่งคำตอบ</button>');
    submitBtn.addEventListener('click', function(){ finishQuiz(); });
    nav.appendChild(submitBtn);
  }
  card.appendChild(nav);

  var jumpWrap = el('<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:16px;"></div>');
  quiz.questions.forEach(function(qq, i){
    var dot = el('<button class="btn-sm" style="width:34px;height:34px;padding:0;border-radius:8px;border:1.5px solid #dde3ea;background:' +
      (i === quiz.index ? 'var(--primary)' : (quiz.answers[qq.id] ? 'var(--primary-soft)' : '#fff')) +
      ';color:' + (i === quiz.index ? '#fff' : 'var(--text)') + ';cursor:pointer;font-size:.75rem;">' + (i + 1) + '</button>');
    dot.addEventListener('click', function(){ quiz.index = i; renderQuizQuestion(); });
    jumpWrap.appendChild(dot);
  });
  card.appendChild(jumpWrap);

  wrap.appendChild(card);
  app.appendChild(main);

  if (quiz.timeLimit){
    startOrUpdateTimer();
  }
}

function startOrUpdateTimer(){
  var quiz = currentQuiz;
  if (!quiz) return;
  function tick(){
    if (!currentQuiz || currentQuiz !== quiz) return;
    var elapsed = Math.floor((Date.now() - quiz.startedAt) / 1000);
    var remaining = quiz.timeLimit - elapsed;
    var display = document.getElementById('timerDisplay');
    if (remaining <= 0){
      if (display) display.textContent = '00:00';
      finishQuiz();
      return;
    }
    if (display){
      var m = Math.floor(remaining / 60), s = remaining % 60;
      display.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    }
    quiz.timerId = setTimeout(tick, 1000);
  }
  if (quiz.timerId) clearTimeout(quiz.timerId);
  tick();
}

function checkAnswerInline(q, letter, optsWrap, feedbackHolder){
  feedbackHolder.innerHTML = '<div class="tiny">กำลังตรวจ...</div>';
  apiCall('checkAnswer', {username: session.username, sessionToken: session.sessionToken, id: q.id, selected: letter}).then(function(resp){
    if (handleSessionInvalidIfNeeded(resp)) return;
    if (!currentQuiz) return; // ผู้ใช้ออกจากหน้านี้ไปแล้วระหว่างรอผลตรวจ
    if (!resp.ok){
      feedbackHolder.innerHTML = '';
      feedbackHolder.appendChild(el('<div class="msg msg-error">ตรวจคำตอบไม่สำเร็จ ลองใหม่อีกครั้ง</div>'));
      return;
    }
    currentQuiz.checked[q.id] = {correct: resp.correct, correctAnswer: resp.correctAnswer};
    optsWrap.querySelectorAll('.opt').forEach(function(o){
      var l = o.getAttribute('data-letter');
      o.classList.remove('correct','wrong');
      if (l === resp.correctAnswer) o.classList.add('correct');
      else if (l === letter && !resp.correct) o.classList.add('wrong');
    });
    renderAnswerFeedback(feedbackHolder, {correct: resp.correct, correctAnswer: resp.correctAnswer});
  });
}

function renderAnswerFeedback(feedbackHolder, info){
  feedbackHolder.innerHTML = '';
  var cls = info.correct ? 'msg-success' : 'msg-error';
  var text = info.correct ? '✅ ถูกต้อง!' : '❌ ไม่ถูกต้อง — เฉลยคือข้อ ' + info.correctAnswer;
  feedbackHolder.appendChild(el('<div class="msg ' + cls + '" style="margin-top:12px;">' + text + '</div>'));
}

function escapeHtml(s){
  var d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

function finishQuiz(){
  var quiz = currentQuiz;
  if (!quiz) return;
  if (quiz.timerId) clearTimeout(quiz.timerId);

  var durationSeconds = Math.floor((Date.now() - quiz.startedAt) / 1000);
  var answersPayload = quiz.questions.map(function(q){ return {id: q.id, selected: quiz.answers[q.id] || ''}; });

  if (quiz.mode === 'demo'){
    // ตรวจในเครื่องเลย เพราะเป็นคำถามตัวอย่างที่มีเฉลยฝังอยู่แล้ว ไม่ต้องผ่านเซิร์ฟเวอร์
    var score = 0;
    var results = quiz.questions.map(function(q){
      var selected = quiz.answers[q.id] || '';
      var correct = selected === q.answer;
      if (correct) score++;
      return {id:q.id, q:q.q, options:q.options, selected: selected, correctAnswer: q.answer, correct: correct};
    });
    renderResult({score: score, total: quiz.questions.length, percentage: Math.round((score/quiz.questions.length)*10000)/100, results: results}, quiz);
    return;
  }

  apiCall('submitAttempt', {
    username: session.username, sessionToken: session.sessionToken,
    subject: quiz.subject, answers: answersPayload, durationSeconds: durationSeconds
  }).then(function(resp){
    if (handleSessionInvalidIfNeeded(resp)) return;
    if (!resp.ok){
      alert('ส่งคำตอบไม่สำเร็จ กรุณาลองใหม่');
      return;
    }
    // แนบข้อความคำถาม/ตัวเลือกจาก quiz เดิม เพื่อแสดงรีวิวได้ (server ส่งกลับแค่ id/selected/correctAnswer/correct)
    var byId = {};
    quiz.questions.forEach(function(q){ byId[q.id] = q; });
    resp.results.forEach(function(r){
      var q = byId[r.id];
      if (q){ r.q = q.q; r.options = q.options; }
    });
    renderResult(resp, quiz);
  });
}

/* ================= RESULT ================= */
function renderResult(result, quiz){
  currentQuiz = null;
  app.innerHTML = '';
  app.appendChild(el('<div class="topbar"><div class="brand"><span class="badge">จสอ</span> ผลคะแนน</div></div>'));
  var main = el('<main><div class="wrap"></div></main>');
  var wrap = main.querySelector('.wrap');

  var card = el('<div class="card" style="text-align:center;"></div>');
  card.appendChild(el('<h1>สรุปผลคะแนน</h1>'));
  card.appendChild(el('<div style="font-size:2.4rem;font-weight:800;color:var(--primary-dark);">' + result.score + ' / ' + result.total + '</div>'));
  card.appendChild(el('<div style="color:var(--gold-dark);font-weight:700;font-size:1.1rem;margin-bottom:10px;">' + result.percentage + '%</div>'));
  wrap.appendChild(card);

  var reviewCard = el('<div class="card"><h2>เฉลยรายข้อ</h2></div>');
  (result.results || []).forEach(function(r, i){
    var block = el('<div style="margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid #eef1f5;"></div>');
    block.appendChild(el('<div class="tiny">ข้อ ' + (i+1) + '</div>'));
    block.appendChild(el('<div class="q-text" style="font-size:.95rem;">' + escapeHtml(r.q || '') + '</div>'));
    var opts = r.options || {};
    Object.keys(opts).forEach(function(letter){
      var cls = 'opt';
      if (letter === r.correctAnswer) cls += ' correct';
      else if (letter === r.selected && !r.correct) cls += ' wrong';
      reviewCard.querySelectorAll; // no-op keep linter quiet
      block.appendChild(el('<div class="' + cls + '"><span class="letter">' + letter + '.</span><span>' + escapeHtml(opts[letter]) + '</span></div>'));
    });
    if (!r.selected){
      block.appendChild(el('<div class="tiny" style="color:var(--danger);">ไม่ได้ตอบข้อนี้</div>'));
    }
    reviewCard.appendChild(block);
  });
  wrap.appendChild(reviewCard);

  var doneBtn = el('<button class="btn btn-primary">เสร็จสิ้น</button>');
  doneBtn.addEventListener('click', function(){
    var fn = (quiz && quiz.onFinish) || renderHome;
    fn();
  });
  wrap.appendChild(doneBtn);

  app.appendChild(main);
}

/* ================= HISTORY ================= */
function renderHistory(){
  app.innerHTML = '';
  app.appendChild(el('<div class="topbar"><div class="brand"><span class="badge">จสอ</span> ประวัติคะแนนของฉัน</div><button id="backBtn">กลับ</button></div>'));
  app.querySelector('#backBtn').addEventListener('click', renderHome);

  var main = el('<main><div class="wrap"></div></main>');
  var wrap = main.querySelector('.wrap');
  var card = el('<div class="card"><h1>ประวัติคะแนนของฉัน</h1><p class="sub">กำลังโหลด...</p></div>');
  wrap.appendChild(card);
  app.appendChild(main);

  apiCall('getHistory', {username: session.username, sessionToken: session.sessionToken}).then(function(resp){
    if (handleSessionInvalidIfNeeded(resp)) return;
    card.innerHTML = '';
    card.appendChild(el('<h1>ประวัติคะแนนของฉัน</h1>'));
    if (!resp.ok){
      card.appendChild(el('<div class="msg msg-error">โหลดประวัติไม่สำเร็จ</div>'));
      return;
    }
    var s = resp.stats;
    var stats = el('<div class="stat-grid"></div>');
    stats.appendChild(el('<div class="stat-box"><div class="num">' + s.count + '</div><div class="lbl">จำนวนครั้ง</div></div>'));
    stats.appendChild(el('<div class="stat-box"><div class="num">' + s.best + '%</div><div class="lbl">คะแนนสูงสุด</div></div>'));
    stats.appendChild(el('<div class="stat-box"><div class="num">' + (s.latest === null ? '-' : s.latest + '%') + '</div><div class="lbl">คะแนนล่าสุด</div></div>'));
    stats.appendChild(el('<div class="stat-box"><div class="num">' + s.average + '%</div><div class="lbl">คะแนนเฉลี่ย</div></div>'));
    card.appendChild(stats);

    if (resp.history.length === 0){
      card.appendChild(el('<p class="sub">ยังไม่มีประวัติการสอบ ลองไปฝึกทำข้อสอบดูก่อนนะ</p>'));
    } else {
      var table = el('<table><thead><tr><th>วันที่</th><th>วิชา</th><th>คะแนน</th><th>%</th></tr></thead><tbody></tbody></table>');
      var tbody = table.querySelector('tbody');
      resp.history.forEach(function(h){
        tbody.appendChild(el('<tr><td>' + fmtDate(h.timestamp) + '</td><td>' + escapeHtml(subjectTitle(h.subject)) + '</td><td>' + h.score + '/' + h.total + '</td><td>' + h.percentage + '%</td></tr>'));
      });
      card.appendChild(table);
    }
  });
}

/* ================= ADMIN ================= */
function renderAdminLogin(){
  app.innerHTML = '';
  app.appendChild(el('<div class="topbar"><div class="brand"><span class="badge">จสอ</span> ผู้ดูแลระบบ</div></div>'));
  var main = el('<main><div class="wrap"></div></main>');
  var wrap = main.querySelector('.wrap');
  var card = el('<div class="card"><h1>เข้าสู่ระบบผู้ดูแล</h1><p class="sub">กรอกรหัสลับผู้ดูแลระบบ</p></div>');
  var msgHolder = el('<div></div>');
  card.appendChild(msgHolder);
  card.appendChild(el('<label>Admin Key</label>'));
  var input = el('<input type="password">');
  card.appendChild(input);
  var btn = el('<button class="btn btn-primary">เข้าสู่ระบบ</button>');
  btn.addEventListener('click', function(){
    adminKey = input.value;
    apiCall('adminListUsers', {adminKey: adminKey}).then(function(resp){
      if (!resp.ok){
        adminKey = null;
        msgHolder.innerHTML = '';
        var adminMsg = resp.error === 'unauthorized' ? 'รหัสลับไม่ถูกต้อง' : ('เกิดข้อผิดพลาด' + debugSuffix(resp));
        msgHolder.appendChild(el('<div class="msg msg-error">' + adminMsg + '</div>'));
        return;
      }
      renderAdminPanel('users', resp.users);
    });
  });
  card.appendChild(btn);
  var back = el('<div style="margin-top:14px;"><button class="link-btn">← กลับไปเข้าสู่ระบบ</button></div>');
  back.querySelector('button').addEventListener('click', function(){ renderLogin(); });
  card.appendChild(back);
  wrap.appendChild(card);
  app.appendChild(main);
}

function renderAdminPanel(tab, preloadedData){
  app.innerHTML = '';
  app.appendChild(el('<div class="topbar"><div class="brand"><span class="badge">จสอ</span> แผงผู้ดูแลระบบ</div><button id="logoutAdminBtn">ออก</button></div>'));
  app.querySelector('#logoutAdminBtn').addEventListener('click', function(){ adminKey = null; renderLogin(); });

  var main = el('<main><div class="wrap"></div></main>');
  var wrap = main.querySelector('.wrap');

  var tabs = el('<div class="admin-tabs"></div>');
  var usersTabBtn = el('<button class="btn ' + (tab==='users'?'btn-primary':'btn-outline') + ' btn-sm">ผู้ใช้งาน</button>');
  var attemptsTabBtn = el('<button class="btn ' + (tab==='attempts'?'btn-primary':'btn-outline') + ' btn-sm">ประวัติคะแนน</button>');
  usersTabBtn.addEventListener('click', function(){ loadAdminUsers(); });
  attemptsTabBtn.addEventListener('click', function(){ loadAdminAttempts(); });
  tabs.appendChild(usersTabBtn); tabs.appendChild(attemptsTabBtn);
  wrap.appendChild(tabs);

  var content = el('<div class="card"></div>');
  wrap.appendChild(content);
  app.appendChild(main);

  if (tab === 'users'){
    renderAdminUsersTable(content, preloadedData || []);
  } else {
    renderAdminAttemptsTable(content, preloadedData || []);
  }
}

function loadAdminUsers(){
  apiCall('adminListUsers', {adminKey: adminKey}).then(function(resp){
    if (!resp.ok){ renderAdminLogin(); return; }
    renderAdminPanel('users', resp.users);
  });
}
function loadAdminAttempts(){
  apiCall('adminListAttempts', {adminKey: adminKey}).then(function(resp){
    if (!resp.ok){ renderAdminLogin(); return; }
    renderAdminPanel('attempts', resp.attempts);
  });
}

function renderAdminUsersTable(content, users){
  content.innerHTML = '';
  content.appendChild(el('<h2>รายชื่อผู้ใช้ (' + users.length + ')</h2>'));
  if (users.length === 0){
    content.appendChild(el('<p class="sub">ยังไม่มีผู้สมัครสมาชิก</p>'));
    return;
  }
  var table = el('<table><thead><tr><th>ผู้ใช้</th><th>สถานะ</th><th>เซสชัน</th><th>จัดการ</th></tr></thead><tbody></tbody></table>');
  var tbody = table.querySelector('tbody');
  users.forEach(function(u){
    var pillClass = u.status === 'active' ? 'pill-active' : (u.status === 'suspended' ? 'pill-suspended' : 'pill-pending');
    var tr = el('<tr><td>' + escapeHtml(u.username) + '</td><td><span class="badge-pill ' + pillClass + '">' + u.status + '</span></td><td>' + (u.hasActiveSession ? '🟢' : '⚪') + '</td><td></td></tr>');
    var actionsTd = tr.querySelector('td:last-child');
    var actionsWrap = el('<div style="display:flex;gap:6px;flex-wrap:wrap;"></div>');

    if (u.status !== 'active'){
      var approveBtn = el('<button class="btn btn-primary btn-sm">✅ อนุมัติ</button>');
      approveBtn.addEventListener('click', function(){
        apiCall('adminApproveUser', {adminKey: adminKey, username: u.username}).then(loadAdminUsers);
      });
      actionsWrap.appendChild(approveBtn);
    }
    if (u.status !== 'suspended'){
      var suspendBtn = el('<button class="btn btn-outline btn-sm">⛔ ระงับ</button>');
      suspendBtn.addEventListener('click', function(){
        apiCall('adminSuspendUser', {adminKey: adminKey, username: u.username}).then(loadAdminUsers);
      });
      actionsWrap.appendChild(suspendBtn);
    }
    var resetBtn = el('<button class="btn btn-outline btn-sm">🔑 รีเซ็ตรหัส</button>');
    resetBtn.addEventListener('click', function(){
      var newPw = prompt('ตั้งรหัสผ่านใหม่ให้ ' + u.username + ' (อย่างน้อย 6 ตัวอักษร)');
      if (!newPw) return;
      apiCall('adminResetPassword', {adminKey: adminKey, username: u.username, newPassword: newPw}).then(function(resp){
        alert(resp.ok ? 'ตั้งรหัสผ่านใหม่สำเร็จ' : 'ไม่สำเร็จ: ' + (resp.error || ''));
      });
    });
    actionsWrap.appendChild(resetBtn);
    var delBtn = el('<button class="btn btn-danger btn-sm">🗑️ ลบ</button>');
    delBtn.addEventListener('click', function(){
      if (!confirm('ยืนยันลบผู้ใช้ ' + u.username + '?')) return;
      var delAttempts = confirm('ต้องการลบประวัติคะแนนของผู้ใช้นี้ด้วยหรือไม่?');
      apiCall('adminDeleteUser', {adminKey: adminKey, username: u.username, deleteAttempts: delAttempts}).then(loadAdminUsers);
    });
    actionsWrap.appendChild(delBtn);

    actionsTd.appendChild(actionsWrap);
    tbody.appendChild(tr);
  });
  content.appendChild(table);
}

function renderAdminAttemptsTable(content, attempts){
  content.innerHTML = '';
  content.appendChild(el('<h2>ประวัติคะแนนทั้งหมด (' + attempts.length + ')</h2>'));
  if (attempts.length === 0){
    content.appendChild(el('<p class="sub">ยังไม่มีประวัติการสอบ</p>'));
    return;
  }
  var table = el('<table><thead><tr><th>ผู้ใช้</th><th>วันที่</th><th>วิชา</th><th>คะแนน</th><th></th></tr></thead><tbody></tbody></table>');
  var tbody = table.querySelector('tbody');
  attempts.forEach(function(a){
    var tr = el('<tr><td>' + escapeHtml(a.username) + '</td><td>' + fmtDate(a.timestamp) + '</td><td>' + escapeHtml(subjectTitle(a.subject)) + '</td><td>' + a.score + '/' + a.total + ' (' + a.percentage + '%)</td><td></td></tr>');
    var delBtn = el('<button class="btn btn-danger btn-sm">ลบ</button>');
    delBtn.addEventListener('click', function(){
      if (!confirm('ยืนยันลบประวัตินี้?')) return;
      apiCall('adminDeleteAttempt', {adminKey: adminKey, attemptId: a.attemptId}).then(loadAdminAttempts);
    });
    tr.querySelector('td:last-child').appendChild(delBtn);
    tbody.appendChild(tr);
  });
  content.appendChild(table);
}

/* ================= BOOTSTRAP ================= */
function boot(){
  loadSession();
  if (session && session.username && session.sessionToken){
    apiCall('checkSession', {username: session.username, sessionToken: session.sessionToken}).then(function(resp){
      if (resp.ok){ renderHome(); }
      else { clearSession(); renderLogin(); }
    });
  } else {
    renderLogin();
  }
}
boot();

})();
</script>
